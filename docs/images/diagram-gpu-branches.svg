<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="diagram-gpu-branches-title diagram-gpu-branches-desc">
<title id="diagram-gpu-branches-title">How a branch is drawn</title>
<desc id="diagram-gpu-branches-desc">Each branch is uploaded as one small record in a texture and the vertex shader expands it into a ribbon, rope twist or clay tube, drawn in one or a few instanced calls, instead of building every triangle on the CPU; for a 50,000-node flat map WebGL buffers fell from 104 MB to 5 MB plus about 6 MB of record texture.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect x="1" y="1" width="1198" height="758" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
<text x="48" y="56" fill="#4f5d75" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="500" letter-spacing="0.18em">RADIANT · RENDERER</text><text x="48" y="96" fill="#2d3142" font-size="32" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">How a branch is drawn</text><text x="48" y="126" fill="#4f5d75" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">One small record per branch goes to the GPU; the vertex shader turns it into the shape.</text><rect x="40" y="160" width="1120" height="128" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><text x="56" y="184" fill="#5a6580" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">BEFORE · BUILT ON THE CPU</text><rect x="40" y="312" width="1120" height="160" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><text x="56" y="336" fill="#5a6580" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">NOW · EXPANDED ON THE GPU</text><path d="M 304,236 H 352" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 304,396 H 352" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 584,396 H 632" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 864,396 H 912" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><g class="node"><rect x="72" y="200" width="232" height="72" rx="6" fill="#f5f5f5"/><rect x="72" y="200" width="232" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><text x="188" y="232" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">CPU builds triangles</text><text x="188" y="251" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">66 to 100 vertices a branch</text></g><g class="node"><rect x="352" y="200" width="232" height="72" rx="6" fill="#f5f5f5"/><rect x="352" y="200" width="232" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><text x="468" y="232" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Large mesh buffers</text><text x="468" y="251" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">vertices and indices</text></g><g class="node"><rect x="72" y="352" width="232" height="88" rx="6" fill="#f5f5f5"/><rect x="72" y="352" width="232" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="188" y="383" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">One record per branch</text><text x="188" y="402" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">128 bytes; 256 for</text><text x="188" y="420" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Soft clay and Rope</text></g><g class="node"><rect x="352" y="352" width="232" height="88" rx="6" fill="#f5f5f5"/><rect x="352" y="352" width="232" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="468" y="383" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Record texture</text><text x="468" y="402" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">every branch record</text><text x="468" y="420" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">in one integer texture</text></g><g class="node"><rect x="632" y="352" width="232" height="88" rx="6" fill="#f5f5f5"/><rect x="632" y="352" width="232" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/><text x="748" y="383" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Vertex shader</text><text x="748" y="402" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">builds the ribbon,</text><text x="748" y="420" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">rope twist or clay tube</text></g><g class="node"><rect x="912" y="352" width="232" height="88" rx="6" fill="#f5f5f5"/><rect x="912" y="352" width="232" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1028" y="383" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Instanced draw</text><text x="1028" y="402" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">the whole map in</text><text x="1028" y="420" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">one or a few calls</text></g><text x="640" y="230" fill="#4f5d75" font-size="16" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic">Kilobytes per branch, all built on the CPU</text><text x="640" y="252" fill="#4f5d75" font-size="16" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic">and uploaded to WebGL as buffers.</text><text x="48" y="520" fill="#4f5d75" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">WEBGL BUFFERS · 50,000-NODE FLAT MAP</text><text x="168" y="561" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="end">Before</text><rect x="184" y="544" width="624" height="24" rx="2" fill="rgba(79,93,117,0.30)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><text x="820" y="562" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">104 MB</text><text x="168" y="609" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="end">Now</text><rect x="184" y="592" width="30" height="24" rx="2" fill="#bf4520"/><rect x="218" y="592" width="38" height="24" rx="2" fill="#f5f5f5" stroke="#bf4520" stroke-width="1" stroke-dasharray="3,2"/><text x="268" y="610" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">5 MB of buffers + about 6 MB record texture</text><text x="184" y="648" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Rope: 183 MB to 6 MB, plus about 12 MB of texture. Lifted arcs and Paper quilling still use the CPU mesh.</text><line x1="40" y1="688" x2="1160" y2="688" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="48" y="720" fill="#4f5d75" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="136" y="708" width="28" height="16" rx="3" fill="rgba(45,49,66,0.02)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><text x="172" y="720" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Old approach</text><rect x="280" y="708" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="316" y="720" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Now</text><rect x="361" y="708" width="28" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="397" y="720" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Where the branch is built</text><text x="1152" y="720" fill="#4f5d75" font-size="16" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" text-anchor="end" font-style="italic">Figures: radiant/autoresearch/REPORT.md</text>
</svg>
