<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 736" width="1200" height="736" role="img" aria-labelledby="diagram-architecture-title diagram-architecture-desc">
<title id="diagram-architecture-title">Radiant architecture at a glance</title>
<desc id="diagram-architecture-desc">The Rust desktop host (document store, Codex AI client, agent access, windows and menus) talks over IPC to a WebView holding the Svelte UI and controller, a layout worker with its own copy of the document, and the WebGL2 renderer; map files are SQLite databases, and a command-line tool and MCP server give AI assistants access to maps.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect x="1" y="1" width="1198" height="734" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
<text x="48" y="56" fill="#4f5d75" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="500" letter-spacing="0.18em">RADIANT · ARCHITECTURE</text><text x="48" y="96" fill="#2d3142" font-size="32" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">Architecture at a glance</text><text x="48" y="126" fill="#4f5d75" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">A Rust host for files, AI and the Mac; a WebView that edits and draws the map.</text><rect x="40" y="160" width="464" height="440" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><text x="56" y="184" fill="#5a6580" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">WEBVIEW · SVELTE 5 + TYPESCRIPT</text><rect x="552" y="160" width="304" height="440" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><text x="568" y="184" fill="#5a6580" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">RUST HOST · TAURI 2</text><rect x="920" y="160" width="240" height="440" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><text x="936" y="184" fill="#5a6580" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">OUTSIDE THE APP</text><path d="M 148,288 V 448" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 204,448 V 288" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 384,288 V 448" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 472,244 H 552" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M 824,244 H 944" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M 944,444 H 824" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/><path d="M 1040,400 V 288" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/><rect x="60" y="359" width="80" height="18" rx="2" fill="#f0f0f1"/><text x="100" y="372" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDIT OPS</text><rect x="212" y="359" width="64" height="18" rx="2" fill="#f0f0f1"/><text x="244" y="372" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text><rect x="392" y="359" width="56" height="18" rx="2" fill="#f0f0f1"/><text x="420" y="372" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCENE</text><rect x="508" y="218" width="40" height="18" rx="2" fill="#f5f5f5"/><text x="528" y="231" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IPC</text><rect x="836" y="218" width="96" height="18" rx="2" fill="#f5f5f5"/><text x="884" y="231" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE, LOAD</text><rect x="836" y="418" width="96" height="18" rx="2" fill="#f5f5f5"/><text x="884" y="431" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USER GRANT</text><rect x="1048" y="335" width="96" height="18" rx="2" fill="#f0f0f1"/><text x="1096" y="348" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ FILES</text><g class="node"><rect x="88" y="200" width="384" height="88" rx="6" fill="#f5f5f5"/><rect x="88" y="200" width="384" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="280" y="231" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Svelte UI + controller</text><text x="280" y="250" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">main thread</text><text x="280" y="268" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">document, undo, input</text></g><g class="node"><rect x="88" y="448" width="176" height="120" rx="6" fill="#f5f5f5"/><rect x="88" y="448" width="176" height="120" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/><text x="176" y="486" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Layout worker</text><text x="176" y="505" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">own document copy</text><text x="176" y="523" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">sizes, layout,</text><text x="176" y="541" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">branch geometry</text></g><g class="node"><rect x="296" y="448" width="176" height="120" rx="6" fill="#f5f5f5"/><rect x="296" y="448" width="176" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="384" y="486" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">WebGL2 renderer</text><text x="384" y="505" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">branches built</text><text x="384" y="523" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">on the GPU</text><text x="384" y="541" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">labels, pictures</text></g><g class="node"><rect x="584" y="200" width="240" height="88" rx="6" fill="#f5f5f5"/><rect x="584" y="200" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="704" y="231" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Document store</text><text x="704" y="250" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">saves and autosave</text><text x="704" y="268" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">crash recovery</text></g><g class="node"><rect x="584" y="312" width="240" height="72" rx="6" fill="#f5f5f5"/><rect x="584" y="312" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="704" y="344" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Codex AI client</text><text x="704" y="363" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">AI drafting via Codex</text></g><g class="node"><rect x="584" y="408" width="240" height="72" rx="6" fill="#f5f5f5"/><rect x="584" y="408" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="704" y="440" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Agent access</text><text x="704" y="459" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">user-approved grants</text></g><g class="node"><rect x="584" y="504" width="240" height="72" rx="6" fill="#f5f5f5"/><rect x="584" y="504" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="704" y="536" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Windows, menus, macOS</text><text x="704" y="555" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">drag, print, Reminders</text></g><g class="node"><rect x="944" y="200" width="192" height="88" rx="6" fill="#f5f5f5"/><rect x="944" y="200" width="192" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="1040" y="231" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Map files</text><text x="1040" y="250" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">one SQLite</text><text x="1040" y="268" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">database per map</text></g><g class="node"><rect x="944" y="400" width="192" height="88" rx="6" fill="#f5f5f5"/><rect x="944" y="400" width="192" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.45)" stroke-width="1"/><text x="1040" y="431" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">CLI + MCP server</text><text x="1040" y="450" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">for AI assistants</text><text x="1040" y="468" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">files or the open map</text></g><line x1="40" y1="632" x2="1160" y2="632" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="48" y="664" fill="#4f5d75" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="136" y="652" width="28" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="172" y="664" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Off the main thread</text><rect x="329" y="652" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="365" y="664" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">App code</text><rect x="445" y="652" width="28" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="481" y="664" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Stored data</text><rect x="582" y="652" width="28" height="16" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.45)" stroke-width="1"/><text x="618" y="664" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Outside the app</text><line x1="747" y1="660" x2="775" y2="660" stroke="#2e5aa8" stroke-width="1.4"/><text x="783" y="664" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Assistant access</text><text x="136" y="696" fill="#4f5d75" font-size="16" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic">Maps under 1,000 nodes are laid out on the main thread; larger maps use the worker.</text>
</svg>
