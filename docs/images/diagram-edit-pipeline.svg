<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 948" width="1200" height="948" role="img" aria-labelledby="diagram-edit-pipeline-title diagram-edit-pipeline-desc">
<title id="diagram-edit-pipeline-title">What happens when you edit a node</title>
<desc id="diagram-edit-pipeline-desc">An edit becomes small operations that the layout worker applies to its own copy of the document; it recomputes only the changed sizes, layout, branch specs and scene, sends one result back to the main thread, which uploads the branch records to the GPU and draws the next frame, while the edit is journalled to the map file after a frame.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
<rect x="1" y="1" width="1198" height="946" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
<text x="48" y="56" fill="#4f5d75" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="500" letter-spacing="0.18em">RADIANT · EDIT PIPELINE</text><text x="48" y="96" fill="#2d3142" font-size="32" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">What happens when you edit a node</text><text x="48" y="126" fill="#4f5d75" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Edits travel as small operations, and only the part of the map they touch is recomputed.</text><rect x="40" y="156" width="1120" height="712" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><line x1="40" y1="192" x2="1160" y2="192" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><text x="168" y="179" fill="#5a6580" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RUST HOST</text><line x1="296" y1="156" x2="296" y2="868" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><text x="440" y="179" fill="#5a6580" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MAIN THREAD</text><line x1="584" y1="156" x2="584" y2="868" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><text x="728" y="179" fill="#5a6580" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LAYOUT WORKER</text><line x1="872" y1="156" x2="872" y2="868" stroke="rgba(45,49,66,0.16)" stroke-width="1"/><text x="1016" y="179" fill="#5a6580" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WEBGL2 · GPU</text><path d="M 440,288 V 328" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 540,364 H 628" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 728,400 V 440" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 612,596 H 540" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/><path d="M 440,632 V 700 Q 440,708 448,708 H 916" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 1016,744 V 784" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 340,364 H 176 Q 168,364 168,372 V 440" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="564" y="338" width="40" height="18" rx="2" fill="#f0f0f1"/><text x="584" y="351" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPS</text><rect x="544" y="570" width="64" height="18" rx="2" fill="#f0f0f1"/><text x="576" y="583" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text><rect x="664" y="682" width="128" height="18" rx="2" fill="#f0f0f1"/><text x="728" y="695" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BRANCH RECORDS</text><rect x="194" y="338" width="120" height="18" rx="2" fill="#f0f0f1"/><text x="254" y="351" fill="#5a6580" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AFTER A FRAME</text><g class="node"><rect x="340" y="216" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="340" y="216" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="440" y="248" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">You edit a node</text><text x="440" y="267" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">type, add, move, style</text></g><g class="node"><rect x="340" y="328" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="340" y="328" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="440" y="360" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Editor makes ops</text><text x="440" y="379" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">small, undoable changes</text></g><g class="node"><rect x="628" y="328" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="628" y="328" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="728" y="360" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Apply to replica</text><text x="728" y="379" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">the worker's own copy</text></g><g class="node"><rect x="612" y="440" width="232" height="216" rx="6" fill="#f5f5f5"/><rect x="612" y="440" width="232" height="216" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/><text x="728" y="472" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Recompute the change</text><text x="728" y="494" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">untouched parts are reused</text><rect x="636" y="524" width="184" height="24" rx="4" fill="#ffffff" stroke="rgba(191,69,32,0.45)" stroke-width="1"/><text x="652" y="541" fill="#bf4520" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="600">1</text><text x="672" y="541" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">node sizes</text><rect x="636" y="556" width="184" height="24" rx="4" fill="#ffffff" stroke="rgba(191,69,32,0.45)" stroke-width="1"/><text x="652" y="573" fill="#bf4520" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="600">2</text><text x="672" y="573" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">layout</text><rect x="636" y="588" width="184" height="24" rx="4" fill="#ffffff" stroke="rgba(191,69,32,0.45)" stroke-width="1"/><text x="652" y="605" fill="#bf4520" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="600">3</text><text x="672" y="605" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">branch specs</text><rect x="636" y="620" width="184" height="24" rx="4" fill="#ffffff" stroke="rgba(191,69,32,0.45)" stroke-width="1"/><text x="652" y="637" fill="#bf4520" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="600">4</text><text x="672" y="637" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">scene</text></g><g class="node"><rect x="340" y="560" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="340" y="560" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="440" y="592" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Adopt the result</text><text x="440" y="611" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">typed arrays + JSON</text></g><g class="node"><rect x="916" y="672" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="916" y="672" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1016" y="704" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Upload records</text><text x="1016" y="723" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">to the record texture</text></g><g class="node"><rect x="916" y="784" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="916" y="784" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1016" y="816" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Draw the next frame</text><text x="1016" y="835" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">shaders build branches</text></g><g class="node"><rect x="68" y="440" width="200" height="108" rx="6" fill="#f5f5f5"/><rect x="68" y="440" width="200" height="108" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="168" y="472" fill="#2d3142" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Journal the edit</text><text x="168" y="491" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">op + document in</text><text x="168" y="509" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">one SQLite commit</text><text x="168" y="527" fill="#4f5d75" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">to the map file</text></g><line x1="40" y1="892" x2="1160" y2="892" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="48" y="924" fill="#4f5d75" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="136" y="912" width="28" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="172" y="924" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Incremental work</text><rect x="308" y="912" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="344" y="924" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Step</text><rect x="396" y="912" width="28" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="432" y="924" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Written to disk</text><line x1="561" y1="920" x2="589" y2="920" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4"/><text x="597" y="924" fill="#2d3142" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Off the edit path</text><text x="1152" y="924" fill="#4f5d75" font-size="16" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" text-anchor="end" font-style="italic">Under 1,000 nodes, worker steps run on the main thread.</text>
</svg>
